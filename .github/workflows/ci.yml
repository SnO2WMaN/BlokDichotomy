name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Supersede stale runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Builds with Mathlib's olean cache, and turns every warning into an error, matching the
      # pre-push hook (`lake build BlokDichotomy --wfail`).
      - uses: leanprover/lean-action@v1
        with:
          build-args: "BlokDichotomy --wfail"

      - uses: extractions/setup-just@v3

      # The main theorem is checked by the kernel against its statement, and must reach only the
      # standard axioms (`propext`, `Quot.sound`, `Classical.choice`): no `sorry`, no `axiom`.
      - name: Check the proof
        run: lake check

      # `mk_all` is deterministic, so regenerating the root module and finding it different from
      # `HEAD` means the commit is missing an import.
      - name: Check mk_all executed
        run: |
          just mk-all
          if ! git diff HEAD --quiet -- BlokDichotomy.lean; then
            echo "BlokDichotomy.lean was out of date. Run 'just mk-all' and commit the changes."
            exit 1
          fi

  # Only what `deploy` publishes from `main`; `workflow_dispatch` lets a branch try it out.
  import-graph:
    name: Generate import graph
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          build-args: "BlokDichotomy"

      - uses: extractions/setup-just@v3
      - uses: ts-graphviz/setup-graphviz@v2

      - run: just import-graph

      - uses: actions/upload-pages-artifact@v5
        with:
          path: import-graph

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: import-graph
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
